{% set name = "album-package" %}
{% set version = "0.6.0" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/album_package-{{ version }}.tar.gz
  sha256: 969002dc6048b1c06be0093ae8b399697ef0f0b2fc62a4647661640366ad7934

build:
  noarch: python
  script: {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  number: 0

requirements:
  host:
    - python {{ python_min }}
    - pip
    - setuptools >=42
  run:
    - python >={{ python_min }}
    - album >=1.0.0,<2.0.0
    - album-gui >=0.5.2,<0.6
    - pyinstaller >=4.8

test:
  imports:
    - album
  commands:
    - pip check
  requires:
    - pip
    - python {{ python_min }}

about:
  home: https://album.solutions
  summary: album plugin for packaging a solution
  dev_url: https://gitlab.com/album-app/plugins/album-package
  license: MIT
  license_file: LICENSE

extra:
  recipe-maintainers:
    - jpalbrecht
    - frauzufall
